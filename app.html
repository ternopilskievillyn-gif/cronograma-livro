<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clube do Livro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bodoni+Moda:ital,wght@1,700&family=Caveat:wght@500;700&family=Chonburi&family=Cinzel+Decorative:wght@900&family=Limelight&family=Playfair+Display:wght@700;900&family=Rye&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0e1c9;--card:#fbf3e3;--ink:#4b2f1c;--muted:#8d7860;--accent:#b8741f;--accent-d:#8c5410;--line:#e2d2b6;--ok:#3f8f5a;--dark:#443d36;--noise-soft:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .1  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 30%,#f7ecd9,transparent 70%),var(--noise-soft),var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:18px 16px 60px}
h2{margin:.2em 0 .6em;font-size:1.3rem}
h3{margin:1.2em 0 .4em}
.card{background:var(--card);border:1px solid #eadbbf;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 22px #6b46211a}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:9px 16px}
button.ghost{background:transparent;color:var(--accent-d)}
button.danger{border-color:#b33;color:#b33;background:transparent}
button.sm{padding:3px 9px;font-size:.85rem}
input,textarea,select{font:inherit;width:100%;padding:9px 12px;border:1px solid #e0d0b3;border-radius:12px;background:#f6ead5;color:var(--ink)}
textarea{resize:vertical;min-height:62px}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .3s}
.muted{color:var(--muted);font-size:.9rem}
.avatar{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.2rem;background:var(--accent);flex:none}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pick{text-align:center;cursor:pointer;padding:14px 8px}
.pick:hover{border-color:var(--accent)}
.pick .avatar{width:56px;height:56px;font-size:1.8rem;margin-bottom:6px}
.day{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card);overflow:hidden}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px #c8741a33}
.day.done .dh{background:#3f8f5a1f}
.dh{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.dh input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);flex:none}
.dh .t{flex:1}
.dh b{display:block}
.tag{font-size:.75rem;background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px}
.qs{padding:4px 14px 14px;border-top:1px solid var(--line);display:none}
.day.open .qs{display:block}
.qs label{color:var(--ink);font-weight:600;font-size:.9rem}
.qs label small{font-weight:400;color:var(--muted)}
.meet{border-left:4px solid var(--accent);padding:4px 12px;margin:8px 0}
.club td,.club th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.club{width:100%;border-collapse:collapse}
@media print{header,.noprint,button{display:none!important}.day .qs{display:block}body{background:#fff;color:#000}}

/* ---------- tela de login (aquarela floral) ---------- */
body.auth-screen{background:radial-gradient(ellipse at 12% 18%,#fbefdd,transparent 60%),radial-gradient(ellipse at 88% 82%,#f7e0c3,transparent 60%),#f3e4d0;color:#4b2f1c}
body.auth-screen header{display:none}
body.auth-screen main{max-width:none;padding:0}
.lwrap{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:28px 16px;overflow:hidden}
.lbox{position:relative;width:min(100%,470px)}
.deco{position:absolute;pointer-events:none;user-select:none}
.deco.lamb{width:min(210px,calc((100vw - 470px)/2 + 10px));right:calc(100% - 26px);bottom:-14px;z-index:3;filter:drop-shadow(0 8px 10px #7a54282e)}
.lcard{position:relative;z-index:2;background:#fbf3e3;border-radius:36px 58px 30px 30px;padding:34px 32px 30px;box-shadow:0 14px 44px #8a5a2a26,0 2px 6px #8a5a2a1a}
.ltitle{text-align:center;margin:0 0 22px;line-height:1;font-size:2.7rem}
.lt{display:inline-block;font:900 1em/1 "Playfair Display",serif;padding:.06em .16em .02em;margin:0 .02em;box-shadow:0 2px 3px #0003;transform:rotate(var(--tr))}
.field{position:relative;display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:0 16px;height:56px;border:1px solid #a8733a;border-radius:16px;background:#fbf3e3}
.field svg{flex:none;width:22px;height:22px;stroke:#8a5a2a;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.field input{flex:1;min-width:0;width:auto;border:0;padding:0;background:transparent;font:500 1.25rem "Caveat",cursive;color:#4b2f1c;outline:none}
.field input::placeholder{color:#9b8168;opacity:1}
.field:focus-within{box-shadow:0 0 0 3px #a8733a33}
.eye{border:0;background:transparent;padding:4px;display:grid;cursor:pointer}
.eye svg{stroke:#8a5a2a}
.lbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:14px;font:600 1.5rem "Caveat",cursive;cursor:pointer;border:1px solid #a8733a;transition:background .2s}
.lbtn.primary{background:#a8733a;color:#fff7ea;font-style:italic;margin:4px 0 14px}
.lbtn.primary:hover{background:#97642c}
.lbtn.ghost{background:transparent;color:#7a4e22;font-size:1.3rem;height:50px}
.lbtn.ghost:hover{background:#a8733a14}
.lrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lrow.one{grid-template-columns:1fr}
.lback{display:block;text-align:center;margin-top:18px;color:#8a5a2a;font:500 1.15rem "Caveat",cursive;text-decoration:none}
.lemojis{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;justify-content:center}
.lemojis button{width:44px;height:44px;border-radius:50%;padding:0;font-size:1.4rem;border:1px solid #a8733a55;background:transparent}
.lemojis button.on{background:#a8733a33;border-color:#a8733a}
@media (max-width:760px){
  .lwrap{align-content:center;gap:0}
  .deco.lamb{position:relative;right:auto;bottom:auto;display:block;align-self:flex-start;margin:0 0 -6px 10px;width:min(38vw,160px);z-index:3}
  .lbox{display:flex;flex-direction:column}
  .lcard{padding:28px 22px 24px}
  .ltitle{font-size:2.3rem}
}

/* ---------- scrapbook: cabeçalho, fundo e cadastro de livro ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.auth-screen .sb-decor{display:none}
.sb-decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sb-decor img{position:absolute;display:block;filter:drop-shadow(0 4px 8px #5a381a30)}
.sb-star{right:0;top:28vh;width:min(11.5vw,178px)}
.sb-flowers{left:0;top:42vh;width:min(8vw,120px)}
header{position:sticky;top:12px;z-index:30;margin:12px auto 0;width:min(1140px,calc(100% - 24px));padding:12px 22px 12px 74px;border-radius:26px;background:rgba(251,243,227,.74);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 24px #6b46211f,inset 0 0 0 1px #fff9;display:flex;align-items:center;gap:16px;color:var(--ink)}
body.auth-screen header{display:none}
header::before{content:"";position:absolute;left:16px;top:50%;width:48px;height:48px;translate:0 -50%;rotate:-14deg;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,4 62,36 96,38 69,59 78,93 50,73 22,93 31,59 4,38 38,36' fill='%23f3c34a' stroke='%23fff' stroke-width='7' stroke-linejoin='round'/></svg>") center/contain no-repeat;filter:drop-shadow(0 2px 3px #0003)}
header h1{margin:0;flex:1;cursor:pointer;font-size:2.4rem;line-height:1.1;font-weight:400}
.rt{display:inline-block;font-size:1em;line-height:1;padding:.05em .14em .02em;margin:0 .03em;box-shadow:0 2px 4px #0003;transform:rotate(var(--tr));background:var(--bg-t);color:var(--c-t);font-family:var(--f-t);font-weight:var(--w-t,400);font-style:var(--s-t,normal)}
.rgap{display:inline-block;width:.35em}
.who{display:flex;align-items:center;gap:10px;font:500 1rem system-ui,sans-serif;color:var(--ink)}
header button{background:transparent;border:1px solid #8c5a2a;color:#6b4423;border-radius:12px;padding:8px 18px;font-size:1rem}
header button:hover{background:#8c5a2a14}
.who .me{display:flex;align-items:center;gap:10px;border:0;padding:4px 8px 4px 4px;border-radius:99px;background:transparent;color:var(--ink);font:inherit}
.who .me:hover{background:#8c5a2a14}
@media (max-width:640px){header{padding:10px 12px 10px 58px;top:8px}header::before{width:38px;height:38px;left:10px}header h1{font-size:1.45rem}.who .nm{display:none}header button{padding:6px 12px}.sb-star,.sb-flowers{display:none}}

.nb{position:relative;background:#fbf3e3;border-radius:26px;padding:34px 34px 40px;box-shadow:0 10px 36px #6b462124,inset 0 0 0 1px #fff8}
.nb-title{margin:0 0 28px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:400}
.torn{display:inline-block;padding:.08em .5em .02em;font:700 2.7rem/1.1 "Caveat",cursive;color:#1f1612;transform:rotate(-1.2deg);clip-path:polygon(0 14%,3% 2%,7% 10%,12% 0,18% 9%,25% 1%,33% 8%,41% 0,50% 9%,58% 1%,66% 8%,75% 0,84% 9%,92% 2%,97% 9%,100% 4%,99% 52%,100% 90%,95% 100%,88% 92%,80% 100%,70% 93%,60% 100%,50% 92%,40% 100%,30% 93%,20% 100%,11% 93%,4% 100%,0 88%,1% 50%)}
.torn.pink{background:#efb9be}.torn.green{background:#a9bb92;transform:rotate(1deg)}
.nb-star{width:46px;height:46px;rotate:12deg}
.nb-smile{position:absolute;right:26px;top:24px;width:84px;height:84px;filter:drop-shadow(0 3px 5px #0003)}
.nb-dash{position:absolute;right:122px;top:36px;width:44px;height:44px;stroke:#d99a2b}
.nb-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:30px;align-items:start}
.cover-box{position:relative;padding:12px;border-radius:20px;background:#f6ead4;box-shadow:inset 0 0 0 1px #fff9}
.cover-box::before{content:"";position:absolute;left:34px;top:-12px;width:92px;height:28px;rotate:-9deg;z-index:2;background:#f2b8c6;background-image:linear-gradient(90deg,#fff7 50%,transparent 50%),linear-gradient(#fff7 50%,transparent 50%);background-size:10px 10px;opacity:.92;box-shadow:0 1px 3px #0002}
.cover-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;aspect-ratio:3/4;border:1.5px dashed #c6b08a;border-radius:12px;background:transparent;color:var(--ink);text-align:center;padding:10px;overflow:hidden;font:inherit}
.cover-drop:hover{background:#a8733a12}
.cover-drop svg{width:44px;height:44px;stroke:#7a5a3a;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.cover-drop b{font-weight:500;font-size:1.05rem}
.cover-drop small{color:#8d7860;font-size:.78rem;line-height:1.5}
.cover-drop img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.cover-drop.has{padding:0;border-style:solid;border-color:#e3d3b4}
.cover-clear{margin-top:8px;width:100%;font-size:.85rem;padding:4px 8px}
.nb-form label.l{display:block;margin:0 0 6px;font-size:.95rem;color:var(--ink)}
.nb-form label.l b{color:#c0392b;font-weight:500;margin-left:2px}
.f{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border:1px solid #e0d0b3;border-radius:12px;background:#f4e8d3;margin-bottom:18px}
.f:focus-within{box-shadow:0 0 0 3px #b8741f30;border-color:#b8741f}
.f svg{flex:none;width:22px;height:22px;stroke:#6b4a2a;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f input{border:0;background:transparent;padding:0;border-radius:0;outline:none;font:inherit;color:var(--ink);flex:1;min-width:0;width:auto}
.f input::placeholder{color:#a8977f}
.nb-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);gap:16px}.nb-form{min-width:0}
.nb-prev{margin:-4px 0 16px}
.nb-actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.nb-actions button{height:56px;padding:0 28px;font:600 1.5rem "Caveat",cursive;font-style:italic;border-radius:12px;display:inline-flex;align-items:center;gap:10px}
.nb-actions .ghost{background:transparent;border:1px solid #b8741f;color:#8c5410}
.nb-actions svg{width:22px;height:22px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round}
.thumb{width:62px;aspect-ratio:3/4;object-fit:cover;border-radius:6px;box-shadow:0 3px 8px #0003;flex:none}
.bookhead{display:flex;align-items:center;gap:18px;margin:22px 0 14px}
.bookcover{flex:none;width:84px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;box-shadow:0 4px 12px #0003}
@media (max-width:760px){
  .nb{padding:24px 18px 28px}.torn{font-size:2rem}.nb-smile{width:56px;height:56px;right:12px;top:12px}.nb-dash{display:none}
  .nb-grid{grid-template-columns:1fr;gap:22px}.cover-box{max-width:220px;margin:0 auto}
  .nb-row{grid-template-columns:1fr}.nb-actions{flex-direction:column;gap:12px}.nb-actions button{width:100%;justify-content:center;white-space:nowrap;height:54px;padding:0 20px;font-size:1.4rem}
}

/* ---------- alertas (SweetAlert2) e admin ---------- */
.swal2-popup.sw-pop{background:#fbf3e3;border-radius:26px;padding:28px 22px 24px;width:min(92vw,420px);box-shadow:0 18px 50px #4b2f1c55;font-family:system-ui,sans-serif}
.sw-title{font:700 2rem/1.1 "Caveat",cursive!important;color:#4b2f1c!important;padding:0 8px!important}
.sw-text{color:#6b5238!important;font-size:1rem!important;line-height:1.5!important}
.sw-actions{gap:12px;margin-top:20px!important}
.sw-ok,.sw-cancel{font:600 1.35rem "Caveat",cursive;font-style:italic;border-radius:12px;padding:9px 28px;cursor:pointer;transition:background .2s}
.sw-ok{background:#b8741f;color:#fff7ea;border:1px solid #b8741f}
.sw-ok:hover{background:#a2641a}
.sw-ok.sw-danger{background:#a33a2e;border-color:#a33a2e}
.sw-ok.sw-danger:hover{background:#8e3025}
.sw-cancel{background:transparent;color:#8c5410;border:1px solid #b8741f}
.sw-cancel:hover{background:#b8741f14}
.sw-ok:focus-visible,.sw-cancel:focus-visible{outline:2px solid #4b2f1c;outline-offset:2px}
.swal2-popup.sw-toast{background:#fbf3e3!important;border-radius:16px;box-shadow:0 8px 26px #4b2f1c40;padding:10px 20px!important;width:auto!important;max-width:92vw}
.swal2-popup.sw-toast .swal2-icon{margin:0 10px 0 0!important}
.swal2-popup.sw-toast .sw-toast-title{margin:0!important}
.sw-toast-title{font:700 1.3rem "Caveat",cursive!important;color:#4b2f1c!important}
.adm-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.adm-row:last-child{border-bottom:0}
.adm-info{flex:1;min-width:0}
.adm-prog{font-size:.85rem;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <h1 onclick="go('home')"></h1>
  <div class="who" id="who"></div>
</header>
<div class="sb-decor" aria-hidden="true">
  
  <img class="sb-star" src="img/sb-star.png" alt=""><img class="sb-flowers" src="img/sb-flowers.png" alt="">
</div>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
